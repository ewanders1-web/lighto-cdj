<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lighto" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Pioneer CDJ-style mic spectrum and beat light visualizer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <title>Lighto</title>
  <link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <div class="chassis" id="app">
    <header class="top-bar chrome">
      <div class="brand">
        <span class="brand-mark"></span>
        <h1>Lighto</h1>
        <span class="sub">CDJ SPECTRUM</span>
      </div>
      <div class="bpm-block" title="Estimated tempo">
        <span class="bpm-label">BPM</span>
        <span class="bpm-value" id="bpmValue">--.-</span>
      </div>
      <div class="status" id="status" aria-live="polite">Ready</div>
    </header>

    <main class="display" id="display">
      <canvas id="viz" aria-label="Spectrum visualizer"></canvas>

      <!-- Serato L (CH1) | FLX4 amber CH1/CH2 | Serato R (CH2), symmetric -->
      <div class="flx-meters" id="flxMeters" aria-hidden="true">
        <div class="serato-meter serato-meter-l" id="seratoMeterL" title="Serato L">
          <div class="serato-well" id="seratoWellL"></div>
          <span class="serato-label">L</span>
        </div>
        <div class="flx-ch" data-ch="1">
          <div class="flx-scale" aria-hidden="true">
            <span>CLIP</span><span>6</span><span>3</span><span>0</span><span>-3</span><span>-7</span><span>-15</span><span>-24</span>
          </div>
          <div class="flx-well" id="ch1Well"></div>
          <span class="flx-label">CH1</span>
        </div>
        <div class="flx-ch" data-ch="2">
          <div class="flx-well" id="ch2Well"></div>
          <div class="flx-scale flx-scale-r" aria-hidden="true">
            <span>CLIP</span><span>6</span><span>3</span><span>0</span><span>-3</span><span>-7</span><span>-15</span><span>-24</span>
          </div>
          <span class="flx-label">CH2</span>
        </div>
        <div class="serato-meter serato-meter-r" id="seratoMeterR" title="Serato R">
          <div class="serato-well" id="seratoWellR"></div>
          <span class="serato-label">R</span>
        </div>
      </div>


      <div class="beat-counter" id="beatCounter" aria-label="Beat counter" aria-hidden="true">
        <span class="beat-pad" data-beat="1">1</span>
        <span class="beat-pad" data-beat="2">2</span>
        <span class="beat-pad" data-beat="3">3</span>
        <span class="beat-pad" data-beat="4">4</span>
      </div>
      <!-- Steady 1-second 4-count clock (separate from beat-driven counter above) -->
      <div class="sec-dots" id="secDots" aria-hidden="true">
        <span class="sec-dot" data-sec="1"></span>
        <span class="sec-dot" data-sec="2"></span>
        <span class="sec-dot" data-sec="3"></span>
        <span class="sec-dot" data-sec="4"></span>
      </div>
      <div class="bpm-corner chrome-soft" id="bpmCorner" aria-hidden="true">
        <span class="bpm-label">BPM</span>
        <span class="bpm-value" id="bpmCornerValue">--.-</span>
      </div>
      <div class="mode-toast" id="modeToast" aria-hidden="true"></div>
      <div class="overlay" id="overlay">
        <button type="button" class="tap-btn" id="startBtn">Tap to listen</button>
        <p class="hint">Uses your mic · Safari needs a tap + permission</p>
      </div>
      <div class="denied" id="denied" hidden>
        <p>Microphone access denied.</p>
        <p class="hint">Enable mic for this site in Safari Settings, then reload.</p>
      </div>
      <p class="party-hint" id="partyHint" hidden>Tap for controls</p>
    </main>

    <footer class="controls chrome">
      <div class="control-row">
        <button type="button" class="ctrl-btn" id="toggleBtn" disabled>Stop</button>
        <button type="button" class="ctrl-btn party-btn" id="partyBtn" aria-pressed="false">Party</button>
        <button type="button" class="ctrl-btn mode-btn" id="modeBtn">Mode: Classic</button>
        <button type="button" class="ctrl-btn colors-btn" id="colorsBtn" aria-expanded="false" aria-controls="themeSheet">Colors</button>
        <label class="sens">
          <span>Sens</span>
          <input type="range" id="sensitivity" min="0.4" max="2.5" step="0.05" value="1.7" />
        </label>
        <label class="sens scale-ctl" title="Nodes size / intensity (also Sonar ring size)">
          <span>Scale</span>
          <input type="range" id="scaleCtl" min="0.5" max="2" step="0.05" value="1.3" aria-label="Scale" />
          <output class="scale-val" id="scaleVal">1.30</output>
        </label>
      </div>
      <div class="control-row wave-row" aria-label="Wave controls">
        <label class="sens wave-ctl wave-h" title="Wave height (amplitude) — mainly Wave mode, lightly Classic">
          <span>Height</span>
          <input type="range" id="waveHCtl" min="0.4" max="2" step="0.05" value="1" aria-label="Wave height" />
          <output class="wave-val" id="waveHVal">1.00</output>
        </label>
        <label class="sens wave-ctl wave-w" title="Wave column width (Wave mode)">
          <span>Width</span>
          <input type="range" id="waveWCtl" min="1" max="10" step="0.5" value="3" aria-label="Wave column width" />
          <output class="wave-val" id="waveWVal">3.0</output>
        </label>
        <label class="sens wave-ctl wave-hue" title="Wave palette hue shift (Wave + Classic wave)">
          <span>Hue</span>
          <input type="range" id="waveHueCtl" min="0" max="360" step="5" value="0" aria-label="Wave hue" />
          <output class="wave-val" id="waveHueVal">0°</output>
        </label>
      </div>
      <div class="theme-sheet" id="themeSheet" hidden>
        <div class="theme-chips" id="themeChips" role="listbox" aria-label="Color themes"></div>
      </div>
    </footer>
  </div>
  <script src="app.js?v=20"></script>
</body>
</html>
